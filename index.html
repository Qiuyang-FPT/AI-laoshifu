<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Industrial AI</title></head><body><div class="login"><section class="hero"><div><h1>制造现场智能协作系统</h1><p>Factory · Process · Task · Expert · Knowledge</p></div></section><section class="pane"><div class="card loginbox"><h1>登录系统</h1><div class="field"><label>账号<input id="u" value="operator"></label></div><div class="field"><label>密码<input id="p" type="password" value="demo123"></label></div><button class="btn" style="width:100%" id="login">登录</button><h3>快捷演示账户</h3><div id="quick"></div></div></section></div><script>const A=[['operator','现场操作员','个人任务 / 平板执行'],['leader','作业长','人员 / 分配 / 工序 / 审批'],['expert','专家','会诊 / 知识审核'],['master','Master Admin','布局 / 模板 / 权限 / 治理']];quick.innerHTML=A.map(x=>`<div class="quick" data-u="${x[0]}"><b>${x[1]} · ${x[0]}</b><small>${x[2]} · demo123</small></div>`).join('');document.querySelectorAll('.quick').forEach(x=>x.onclick=()=>{u.value=x.dataset.u;p.value='demo123'});function go(){if(p.value!=='demo123'||!A.some(x=>x[0]===u.value))return alert('密码 demo123');localStorage.role=u.value;location='system.html?page=home'}login.onclick=go;p.onkeydown=e=>{if(e.key==='Enter')go()}</script></body></html>
